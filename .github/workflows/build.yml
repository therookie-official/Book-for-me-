name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and add app code
        run: |
          flutter create --platforms=android --org com.paperreader --project-name paper_reader "$RUNNER_TEMP/pr"
          rm -rf "$RUNNER_TEMP/pr/lib" "$RUNNER_TEMP/pr/test"
          cp -r lib assets pubspec.yaml "$RUNNER_TEMP/pr/"
          sed -i 's/android:label="[^"]*"/android:label="Paper Reader"/' "$RUNNER_TEMP/pr/android/app/src/main/AndroidManifest.xml"

      - name: Build release APK
        working-directory: ${{ runner.temp }}/pr
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Paper Reader build ${{ github.run_number }}
          body: Download app-release.apk below, then open it on your Android phone to install.
          files: ${{ runner.temp }}/pr/build/app/outputs/flutter-apk/app-release.apk
