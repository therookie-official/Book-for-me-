name: paper_reader
description: A PDF reader that feels like reading a real paper book.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdfx: ^2.9.0
  shared_preferences: ^2.2.0
  file_picker: ^8.0.0
  audioplayers: ^6.0.0
  path_provider: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/page.wav
